[project]
name = "inyeongori-backend"
version = "0.1.0"
description = "인연고리 백엔드 (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
# 4단계에서 실제 임베딩(bge-m3)을 쓸 때 설치해요. 용량이 커서 기본 설치에서 뺐어요.
embeddings = [
    "sentence-transformers>=3.3",
]
gemini = [
    "google-genai>=1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
